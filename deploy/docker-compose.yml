# ERP backend + its own PostgreSQL, on a server that already runs other projects.
# Everything here has its own names (erp_*), its own network and its own volume, so it never touches another project.
# Nothing is opened to the internet: the API listens only on 127.0.0.1:3100 (the web server forwards to it) and
# the database has no published port at all.
# Run from the folder that holds this file and the .env file:  docker compose up -d --build
name: erp

services:
  db:
    image: postgres:16-alpine
    container_name: erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    networks: [erp_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768m

  api:
    build:
      context: ..
    container_name: erp_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:3100:3000"
    networks: [erp_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  erp_pgdata:

networks:
  erp_net:
