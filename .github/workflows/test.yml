name: Tests

# Runs the whole test suite on every pull request (and on pushes to other branches) against a throwaway Postgres.
# Make it a required check: GitHub > Settings > Branches > Branch protection rule for main > "Require status checks" > "test".
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_test
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --testTimeout=400000
