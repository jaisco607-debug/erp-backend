name: Deploy backend to VPS

# Runs only when code is pushed to main. Logs in to the VPS with a restricted key
# (that key can only run the deploy script) and updates the backend container.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '[50.2.26.45]:6122 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIz+LXIFgfI3Kb+nTc9DnzUQvBkZ/3RrQDd3S4VkHlyl' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 6122 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 erp@50.2.26.45 api
